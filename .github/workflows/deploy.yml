name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Set to your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Required for recent Angular apps

      - name: Install dependencies
        run: npm ci

      - name: Build the Angular app
        # Replace <your-username> and <repo-name> with your repository details
        run: npm run build -- --base-href="https://github.com/deneth-rajapaksha/nucla-dashboard/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Make sure this matches your Angular 'outputMode' directory structure. 
          # If using browser builder, it is usually dist/<project-name>/browser
          publish_dir: ./dist/app/browser
